name: Madar checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements.txt
      - run: gunicorn --check-config --config gunicorn.conf.py wsgi:application
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile server.py backup.py wsgi.py gunicorn.conf.py
      - run: node --check web/app.js
