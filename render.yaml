# Paid preview: 0.5 CPU/512 MB service + 1 GB persistent disk.
# Review provider billing before applying this Blueprint.
services:
  - type: web
    name: madar-hr
    runtime: python
    repo: https://github.com/madar8/Madar
    branch: main
    plan: 0.5c-512mb
    region: frankfurt
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn.conf.py wsgi:application
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    disk:
      name: madar-data
      mountPath: /var/data/madar
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: MADAR_DATA_DIR
        value: /var/data/madar
      - key: MADAR_SECURE_COOKIE
        value: "1"
      - key: MADAR_SETUP_TOKEN
        generateValue: true
